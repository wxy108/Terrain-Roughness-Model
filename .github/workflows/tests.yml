name: Python tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r environment/requirements-cpu-tested.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q --junitxml=runs/junit.xml
